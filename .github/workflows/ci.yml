name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: repsy
          POSTGRES_PASSWORD: repsy
          POSTGRES_DB: repsy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repsy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI database only - not a real secret.
      DATABASE_URL: postgresql://repsy:repsy@localhost:5432/repsy_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --include=dev

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npx -w server prisma migrate deploy

      - name: Test
        run: npm test
