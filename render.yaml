# Render Blueprint: 1 Web Service (frontend + backend) + 1 PostgreSQL database.
# Secrets (AI_API_KEY etc.) are set in the Render dashboard only — never in this file.
services:
  - type: web
    name: repsy-coach
    runtime: node
    plan: free
    region: virginia
    branch: main
    # Deploy a commit on main only after its GitHub checks (the CI workflow) pass.
    # A commit with failing CI is never deployed.
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build
    # `npm start` runs `prisma migrate deploy` first, then starts the server.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: repsy-db
          property: connectionString
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      # Signs coach session cookies (Prompt 44). Render generates a random value once.
      - key: SESSION_SECRET
        generateValue: true
      # Password reset email (Prompt 47): values are set in the Render dashboard, never in this file.
      # APP_URL is optional: Render's own RENDER_EXTERNAL_URL is used when it is empty.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_URL
        sync: false
      # "Continue with Google" for coaches: an OAuth web client from Google Cloud. Its authorized
      # redirect URI must be APP_URL + /api/auth/callback/google. Set in the dashboard only.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # PORT is set by Render automatically.

databases:
  - name: repsy-db
    databaseName: repsy
    plan: free
    region: virginia
